[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notedesk"
version = "0.1.0"
description = "A local-first agentic workspace for personal knowledge tasks."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0.0",
  "typer>=0.20.0",
]

[project.scripts]
notedesk = "notedesk.cli.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
